<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20ry='14'%20fill='%230d1117'/%3E%3Ctext%20x='32'%20y='46'%20text-anchor='middle'%20fill='%23C8A95C'%20font-family='Arial%2CHelvetica%2Csans-serif'%20font-size='44'%20font-weight='700'%3EG%3C/text%3E%3C/svg%3E">
<title>GraMM-RAG | Interactive Portal</title>
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --panel2:#f6f7f9; --line:#dde2e8;
  --black:#0d1117; --black2:#171d26;
  --gold:#8F6F1E; --gold-br:#C8A95C; --gold-dim:#A98B3A; --gold-soft:#FAF4E4;
  --ink:#0f1419; --mute:#525c6b; --faint:#8a94a2;
  --good:#1C7A4E; --bad:#B3332F; --warn:#A8721B; --blue:#2F5FA8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Segoe UI",Inter,Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--gold)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
.wrap{max-width:1400px;margin:0 auto;padding:0 28px}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid var(--black);overflow:visible}
.bar{display:flex;align-items:center;gap:26px;min-height:86px;
  padding-top:16px;padding-bottom:16px;flex-wrap:wrap;overflow:visible}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;min-width:max-content;
  padding:8px 6px 8px 0;overflow:visible}
.brand .mk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;
  background:var(--black);color:var(--gold-br);font:800 13px/1 var(--mono);flex:0 0 auto}
.brand .wm{display:block;flex:0 0 auto;font:800 17px/1.9 var(--sans);color:var(--black);
  padding:4px 4px 4px 0;letter-spacing:-.01em;white-space:nowrap;overflow:visible}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--mute);font:600 13px var(--sans);
  padding:9px 15px;border-radius:7px;cursor:pointer;transition:.15s}
nav button:hover{color:var(--black);background:var(--panel2)}
nav button[aria-current=true]{color:var(--gold-br);background:var(--black);border-color:var(--black)}

/* ---------- generic ---------- */
.view{display:none;padding:28px 0 20px}
.view.on{display:block}
.lead{color:var(--mute);max-width:74ch}
.eyebrow{font:700 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card h3{font-size:15px;margin-bottom:8px}
.card.dark{background:var(--black);border-color:var(--black);color:#f2f4f7}
.card.dark h3{color:var(--gold-br)}
.card.dark .note{color:#c3cad4}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.sep{height:1px;background:var(--line);margin:26px 0}
.note{color:var(--mute);font-size:13.5px}
.tiny{font-size:12px;color:var(--faint)}
.src{font:600 11px var(--mono);color:var(--gold);letter-spacing:.04em}
code,.mono{font-family:var(--mono)}
mark{background:var(--gold-soft);color:var(--gold);padding:0 3px;border-radius:3px;font-weight:600}
.pill{display:inline-block;font:700 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute);
  white-space:nowrap;flex:0 0 auto}
.pill.ok{color:var(--good);border-color:#A8D6BE;background:#EDF8F2}
.pill.no{color:var(--bad);border-color:#EDB9B7;background:#FDF0EF}
.pill.g{color:var(--gold);border-color:var(--gold-dim);background:var(--gold-soft)}
button.act{background:#fff;border:1px solid var(--line);color:var(--ink);
  font:600 13px var(--sans);padding:9px 16px;border-radius:8px;cursor:pointer;transition:.15s}
button.act:hover{border-color:var(--gold-dim);color:var(--gold)}
button.act.pri{background:var(--black);border-color:var(--black);color:var(--gold-br)}
button.act.pri:hover{background:var(--black2);color:var(--gold-br)}
button.act:disabled{opacity:.35;cursor:not-allowed}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:0 10px 8px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-family:var(--mono)}

/* ---------- footer ---------- */
footer{border-top:2px solid var(--black);margin-top:40px;background:var(--black);color:#aab3bf}
footer .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-top:20px;padding-bottom:20px}
footer b{color:var(--gold-br);font-weight:700}
footer .r{margin-left:auto;font-size:12px;color:#7e8794;text-align:right}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:200;background:rgba(13,17,23,.72);display:none;
  padding:30px;backdrop-filter:blur(3px)}
.modal.on{display:block}
.modal .sheet{background:#fff;border-radius:12px;height:100%;display:flex;flex-direction:column;
  overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);max-width:1100px;margin:0 auto}
.modal .mh{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);
  background:var(--black);color:#fff;flex-wrap:wrap}
.modal .mh b{color:var(--gold-br);font-size:15px}
.modal .mh span{font-size:12px;color:#aab3bf}
.modal .mh button{margin-left:auto}
.modal iframe{flex:1;width:100%;border:0;background:#52565c}
</style>
</head><body>
<header><div class="wrap bar">
  <div class="brand"><span class="mk">G</span><span class="wm">GraMM-RAG</span></div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap" id="main"></main>
<div class="modal" id="pdfModal"><div class="sheet">
  <div class="mh"><b id="pdfTitle"></b><span id="pdfSub"></span>
    <button class="act" onclick="closePdf()">Close</button></div>
  <iframe id="pdfFrame" title="Source document"></iframe>
</div></div>
<footer><div class="wrap">
  <span>Copyright &copy; 2026 <b>Wasiu Sanyaolu </b>&middot; Autonomous Technologies Lab, Bowie State University. All rights reserved.</span>
  <span class="r">GraMM-RAG interactive portal &middot; every figure read from the archived runs</span>
</div></footer>
