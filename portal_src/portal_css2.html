<style>
/* ---------- hero ---------- */
.hero{padding:40px 0 8px}
.hero h1{font-size:37px;line-height:1.14;max-width:26ch;color:var(--black)}
.hero h1 em{color:var(--gold);font-style:normal}
.hero p{margin:16px 0 0;font-size:16.5px;color:var(--mute);max-width:72ch}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0 8px}
.kpi{background:var(--black);border-radius:11px;padding:18px 20px;border-left:5px solid var(--gold-br)}
.kpi b{display:block;font:800 31px/1 var(--sans);color:var(--gold-br);letter-spacing:-.02em}
.kpi span{display:block;margin-top:8px;font-size:13px;color:#c3cad4}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}
.tile{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px;
  cursor:pointer;transition:.16s;text-align:left}
.tile:hover{border-color:var(--gold-dim);box-shadow:0 4px 16px rgba(15,20,25,.08);transform:translateY(-2px)}
.tile b{display:block;font-size:15px;margin-bottom:6px;color:var(--black)}
.tile b i{color:var(--gold);font-style:normal;margin-right:7px;font-family:var(--mono)}
.tile span{font-size:13px;color:var(--mute);line-height:1.5}

/* ---------- case switch ---------- */
.caserow{display:flex;gap:9px;align-items:stretch;flex-wrap:wrap;margin-bottom:12px}
.casebtn{flex:1;min-width:270px;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:10px 13px;cursor:pointer;transition:.15s;color:var(--mute);font:inherit}
.casebtn:hover{border-color:var(--gold-dim)}
.casebtn[aria-pressed=true]{border-color:var(--black);background:var(--black);color:#c3cad4}
.casebtn[aria-pressed=true] b{color:var(--gold-br)}
.casebtn b{display:block;color:var(--gold);font-size:13px;margin-bottom:2px}
.casebtn span{font-size:12px;line-height:1.4;display:block}

/* ---------- question header ---------- */
.qhead{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 17px;margin-bottom:12px}
.qhead .doc{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qhead .q{font-size:17px;line-height:1.3;font-weight:600;color:var(--black)}
.qhead .gold{margin-top:6px;font-size:13px;color:var(--mute)}
.qhead .gold b{color:var(--gold);font-family:var(--mono)}

/* ---------- stage rail ---------- */
.rail{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:12px}
.rail button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;
  cursor:pointer;text-align:left;transition:.15s;color:var(--mute);font:inherit}
.rail button:hover{border-color:var(--gold-dim)}
.rail button.done{border-color:var(--gold-dim);background:var(--gold-soft)}
.rail button[aria-current=true]{border-color:var(--black);background:var(--black)}
.rail button[aria-current=true] em{color:var(--gold-br)}
.rail button[aria-current=true] i{color:#fff}
.rail em{display:block;font:800 11px var(--mono);font-style:normal;color:var(--faint);margin-bottom:3px}
.rail i{display:block;font-style:normal;font-size:12.5px;font-weight:600;color:var(--black);line-height:1.25}

/* ---------- stage panel ---------- */
.stage{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage .top{display:flex;align-items:flex-start;gap:14px;padding:16px 20px;background:var(--black)}
.stage .no{flex:0 0 auto;width:36px;height:36px;border-radius:9px;background:var(--gold-br);color:var(--black);
  display:grid;place-items:center;font:800 16px var(--mono)}
.stage .ttl{flex:1}
.stage .ttl h2{font-size:20px;color:#fff}
.stage .ttl p{margin:4px 0 0;font-size:13.5px;color:#aab3bf}
.stage .top .src{color:var(--gold-br)}
.stage .body{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:0}
.stage .left{padding:18px 20px;border-right:1px solid var(--line);background:var(--panel2)}
.stage .right{padding:18px 20px;min-width:0}
.stage h4{font:700 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.stage .left p{margin:0 0 16px;font-size:13.5px;color:var(--ink);line-height:1.55}
.meas{display:grid;gap:6px}
.meas div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;
  padding:6px 9px;background:#fff;border:1px solid var(--line);border-radius:6px}
.meas span:first-child{color:var(--mute)}
.meas span:last-child{font-family:var(--mono);color:var(--gold);font-weight:700}

/* ---------- transport ---------- */
.transport{display:flex;align-items:center;gap:9px;padding:13px 20px;border-top:1px solid var(--line);
  background:var(--panel2);flex-wrap:wrap}
.transport .spacer{flex:1}
.guide{margin-top:14px;background:var(--black);border-left:5px solid var(--gold-br);
  border-radius:9px;padding:14px 18px;font-size:13.5px;color:#c7ced7;line-height:1.6}
.guide b{color:var(--gold-br)}
.guide mark{background:rgba(200,169,92,.2);color:var(--gold-br)}

/* ---------- artifact widgets ---------- */
.scroller{max-height:430px;overflow:auto;padding-right:6px}
.pstrip{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 12px}
.pg{width:30px;height:38px;border-radius:4px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;font:600 11px var(--mono);color:var(--faint);position:relative}
.pg.ctx{border-color:var(--black);color:#fff;background:var(--black)}
.pg.gold{border-color:var(--gold-dim);background:var(--gold-br);color:var(--black);font-weight:800}
.pg.rank{border-color:var(--blue);color:var(--blue)}
.pg i{position:absolute;top:-6px;right:-5px;font-style:normal;font:700 9px var(--mono);
  background:var(--blue);color:#fff;border-radius:3px;padding:0 3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--faint);margin-bottom:10px}
.legend b{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px;
  border:1px solid var(--line)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;font-size:12.5px}
.bar u{text-decoration:none;color:var(--mute);font-family:var(--mono)}
.bar div{height:16px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar div>i{display:block;height:100%;background:var(--gold-br);border-radius:3px}
.bar s{text-decoration:none;text-align:right;font-family:var(--mono);color:var(--gold);font-weight:700}
.els{display:grid;gap:5px}
.el{display:grid;grid-template-columns:70px 46px 1fr;gap:9px;font-size:12px;align-items:start;
  padding:7px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}
.el b{font:700 9.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);padding-top:1px}
.el u{text-decoration:none;font-family:var(--mono);color:var(--faint);font-size:11px}
.el span{color:var(--ink);line-height:1.45}
.el.key{border-color:var(--gold-dim);background:var(--gold-soft)}
.ueq{background:var(--black);border-radius:10px;padding:18px 20px;margin:4px 0 14px;color:#fff}
.ueq .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 22px var(--mono);color:#fff}
.ueq .line i{font-style:normal;color:var(--gold-br)}
.ueq .line s{text-decoration:none;color:#7e8794;font-weight:400}
.ueq .terms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.ueq .tm{background:var(--black2);border-radius:8px;padding:10px 12px;border-left:3px solid var(--gold-br)}
.ueq .tm b{display:block;font:800 19px var(--mono);color:var(--gold-br)}
.ueq .tm span{display:block;font-size:11.5px;color:#aab3bf;margin-top:3px;line-height:1.4}
.ueq .sum{margin-top:12px;font:700 15px var(--mono);color:var(--gold-br)}
.ueq .sum s{text-decoration:none;color:#aab3bf;font-weight:400;font-size:12px;margin-left:8px}
.arms{display:grid;gap:10px}
.arm{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--panel2)}
.arm.me{border-color:var(--gold-dim);background:var(--gold-soft)}
.arm .hd{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.arm .hd b{font-size:13px;color:var(--black);flex:0 0 auto;white-space:nowrap}
.arm .hd .ctxs{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap}
.arm .ans{font-family:var(--mono);font-size:12.5px;line-height:1.5;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.arm .ans.bad{border-color:#EDB9B7;background:#FDF5F4}
.arm .ans.good{border-color:#A8D6BE;background:#F3FAF6}
.quote{border-left:3px solid var(--gold-br);padding:4px 0 4px 13px;margin:10px 0;font-size:13px;
  color:var(--ink);line-height:1.6;font-style:italic}
.gsvg{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px}
.gsvg svg{display:block;width:100%;height:auto}
@media(max-width:1180px){
  .stage .body{grid-template-columns:1fr}
  .stage .left{border-right:0;border-bottom:1px solid var(--line)}
  .rail{grid-template-columns:repeat(4,1fr)}
  .kpis,.tiles,.g3,.g4{grid-template-columns:1fr 1fr}
  .hero h1{font-size:30px}
  .ueq .terms{grid-template-columns:1fr}
}
@media(max-width:680px){
  .rail{grid-template-columns:repeat(2,1fr)}
  .kpis,.tiles,.g2,.g3,.g4{grid-template-columns:1fr}
  .wrap{padding:0 16px}
}
</style>
