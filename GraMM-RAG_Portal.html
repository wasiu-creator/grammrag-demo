<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20ry='14'%20fill='%230d1117'/%3E%3Ctext%20x='32'%20y='46'%20text-anchor='middle'%20fill='%23C8A95C'%20font-family='Arial%2CHelvetica%2Csans-serif'%20font-size='44'%20font-weight='700'%3EG%3C/text%3E%3C/svg%3E">
<title>GraMM-RAG | Interactive Portal</title>
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --panel2:#f6f7f9; --line:#dde2e8;
  --black:#0d1117; --black2:#171d26;
  --gold:#8F6F1E; --gold-br:#C8A95C; --gold-dim:#A98B3A; --gold-soft:#FAF4E4;
  --ink:#0f1419; --mute:#525c6b; --faint:#8a94a2;
  --good:#1C7A4E; --bad:#B3332F; --warn:#A8721B; --blue:#2F5FA8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Segoe UI",Inter,Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--gold)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
.wrap{max-width:1400px;margin:0 auto;padding:0 28px}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:2px solid var(--black);overflow:visible}
.bar{display:flex;align-items:center;gap:26px;min-height:86px;
  padding-top:16px;padding-bottom:16px;flex-wrap:wrap;overflow:visible}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;min-width:max-content;
  padding:8px 6px 8px 0;overflow:visible}
.brand .mk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;
  background:var(--black);color:var(--gold-br);font:800 13px/1 var(--mono);flex:0 0 auto}
.brand .wm{display:block;flex:0 0 auto;font:800 17px/1.9 var(--sans);color:var(--black);
  padding:4px 4px 4px 0;letter-spacing:-.01em;white-space:nowrap;overflow:visible}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--mute);font:600 13px var(--sans);
  padding:9px 15px;border-radius:7px;cursor:pointer;transition:.15s}
nav button:hover{color:var(--black);background:var(--panel2)}
nav button[aria-current=true]{color:var(--gold-br);background:var(--black);border-color:var(--black)}

/* ---------- generic ---------- */
.view{display:none;padding:28px 0 20px}
.view.on{display:block}
.lead{color:var(--mute);max-width:74ch}
.eyebrow{font:700 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card h3{font-size:15px;margin-bottom:8px}
.card.dark{background:var(--black);border-color:var(--black);color:#f2f4f7}
.card.dark h3{color:var(--gold-br)}
.card.dark .note{color:#c3cad4}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.sep{height:1px;background:var(--line);margin:26px 0}
.note{color:var(--mute);font-size:13.5px}
.tiny{font-size:12px;color:var(--faint)}
.src{font:600 11px var(--mono);color:var(--gold);letter-spacing:.04em}
code,.mono{font-family:var(--mono)}
mark{background:var(--gold-soft);color:var(--gold);padding:0 3px;border-radius:3px;font-weight:600}
.pill{display:inline-block;font:700 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute);
  white-space:nowrap;flex:0 0 auto}
.pill.ok{color:var(--good);border-color:#A8D6BE;background:#EDF8F2}
.pill.no{color:var(--bad);border-color:#EDB9B7;background:#FDF0EF}
.pill.g{color:var(--gold);border-color:var(--gold-dim);background:var(--gold-soft)}
button.act{background:#fff;border:1px solid var(--line);color:var(--ink);
  font:600 13px var(--sans);padding:9px 16px;border-radius:8px;cursor:pointer;transition:.15s}
button.act:hover{border-color:var(--gold-dim);color:var(--gold)}
button.act.pri{background:var(--black);border-color:var(--black);color:var(--gold-br)}
button.act.pri:hover{background:var(--black2);color:var(--gold-br)}
button.act:disabled{opacity:.35;cursor:not-allowed}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:0 10px 8px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-family:var(--mono)}

/* ---------- footer ---------- */
footer{border-top:2px solid var(--black);margin-top:40px;background:var(--black);color:#aab3bf}
footer .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-top:20px;padding-bottom:20px}
footer b{color:var(--gold-br);font-weight:700}
footer .r{margin-left:auto;font-size:12px;color:#7e8794;text-align:right}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:200;background:rgba(13,17,23,.72);display:none;
  padding:30px;backdrop-filter:blur(3px)}
.modal.on{display:block}
.modal .sheet{background:#fff;border-radius:12px;height:100%;display:flex;flex-direction:column;
  overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);max-width:1100px;margin:0 auto}
.modal .mh{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);
  background:var(--black);color:#fff;flex-wrap:wrap}
.modal .mh b{color:var(--gold-br);font-size:15px}
.modal .mh span{font-size:12px;color:#aab3bf}
.modal .mh button{margin-left:auto}
.modal iframe{flex:1;width:100%;border:0;background:#52565c}
</style>
<style>
/* ---------- hero ---------- */
.hero{padding:40px 0 8px}
.hero h1{font-size:37px;line-height:1.14;max-width:26ch;color:var(--black)}
.hero h1 em{color:var(--gold);font-style:normal}
.hero p{margin:16px 0 0;font-size:16.5px;color:var(--mute);max-width:72ch}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0 8px}
.kpi{background:var(--black);border-radius:11px;padding:18px 20px;border-left:5px solid var(--gold-br)}
.kpi b{display:block;font:800 31px/1 var(--sans);color:var(--gold-br);letter-spacing:-.02em}
.kpi span{display:block;margin-top:8px;font-size:13px;color:#c3cad4}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}
.tile{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px;
  cursor:pointer;transition:.16s;text-align:left}
.tile:hover{border-color:var(--gold-dim);box-shadow:0 4px 16px rgba(15,20,25,.08);transform:translateY(-2px)}
.tile b{display:block;font-size:15px;margin-bottom:6px;color:var(--black)}
.tile b i{color:var(--gold);font-style:normal;margin-right:7px;font-family:var(--mono)}
.tile span{font-size:13px;color:var(--mute);line-height:1.5}

/* ---------- case switch ---------- */
.caserow{display:flex;gap:9px;align-items:stretch;flex-wrap:wrap;margin-bottom:12px}
.casebtn{flex:1;min-width:270px;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:10px 13px;cursor:pointer;transition:.15s;color:var(--mute);font:inherit}
.casebtn:hover{border-color:var(--gold-dim)}
.casebtn[aria-pressed=true]{border-color:var(--black);background:var(--black);color:#c3cad4}
.casebtn[aria-pressed=true] b{color:var(--gold-br)}
.casebtn b{display:block;color:var(--gold);font-size:13px;margin-bottom:2px}
.casebtn span{font-size:12px;line-height:1.4;display:block}

/* ---------- question header ---------- */
.qhead{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 17px;margin-bottom:12px}
.qhead .doc{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qhead .q{font-size:17px;line-height:1.3;font-weight:600;color:var(--black)}
.qhead .gold{margin-top:6px;font-size:13px;color:var(--mute)}
.qhead .gold b{color:var(--gold);font-family:var(--mono)}

/* ---------- stage rail ---------- */
.rail{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:12px}
.rail button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;
  cursor:pointer;text-align:left;transition:.15s;color:var(--mute);font:inherit}
.rail button:hover{border-color:var(--gold-dim)}
.rail button.done{border-color:var(--gold-dim);background:var(--gold-soft)}
.rail button[aria-current=true]{border-color:var(--black);background:var(--black)}
.rail button[aria-current=true] em{color:var(--gold-br)}
.rail button[aria-current=true] i{color:#fff}
.rail em{display:block;font:800 11px var(--mono);font-style:normal;color:var(--faint);margin-bottom:3px}
.rail i{display:block;font-style:normal;font-size:12.5px;font-weight:600;color:var(--black);line-height:1.25}

/* ---------- stage panel ---------- */
.stage{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage .top{display:flex;align-items:flex-start;gap:14px;padding:16px 20px;background:var(--black)}
.stage .no{flex:0 0 auto;width:36px;height:36px;border-radius:9px;background:var(--gold-br);color:var(--black);
  display:grid;place-items:center;font:800 16px var(--mono)}
.stage .ttl{flex:1}
.stage .ttl h2{font-size:20px;color:#fff}
.stage .ttl p{margin:4px 0 0;font-size:13.5px;color:#aab3bf}
.stage .top .src{color:var(--gold-br)}
.stage .body{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:0}
.stage .left{padding:18px 20px;border-right:1px solid var(--line);background:var(--panel2)}
.stage .right{padding:18px 20px;min-width:0}
.stage h4{font:700 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.stage .left p{margin:0 0 16px;font-size:13.5px;color:var(--ink);line-height:1.55}
.meas{display:grid;gap:6px}
.meas div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;
  padding:6px 9px;background:#fff;border:1px solid var(--line);border-radius:6px}
.meas span:first-child{color:var(--mute)}
.meas span:last-child{font-family:var(--mono);color:var(--gold);font-weight:700}

/* ---------- transport ---------- */
.transport{display:flex;align-items:center;gap:9px;padding:13px 20px;border-top:1px solid var(--line);
  background:var(--panel2);flex-wrap:wrap}
.transport .spacer{flex:1}
.guide{margin-top:14px;background:var(--black);border-left:5px solid var(--gold-br);
  border-radius:9px;padding:14px 18px;font-size:13.5px;color:#c7ced7;line-height:1.6}
.guide b{color:var(--gold-br)}
.guide mark{background:rgba(200,169,92,.2);color:var(--gold-br)}

/* ---------- artifact widgets ---------- */
.scroller{max-height:430px;overflow:auto;padding-right:6px}
.pstrip{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 12px}
.pg{width:30px;height:38px;border-radius:4px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;font:600 11px var(--mono);color:var(--faint);position:relative}
.pg.ctx{border-color:var(--black);color:#fff;background:var(--black)}
.pg.gold{border-color:var(--gold-dim);background:var(--gold-br);color:var(--black);font-weight:800}
.pg.rank{border-color:var(--blue);color:var(--blue)}
.pg i{position:absolute;top:-6px;right:-5px;font-style:normal;font:700 9px var(--mono);
  background:var(--blue);color:#fff;border-radius:3px;padding:0 3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--faint);margin-bottom:10px}
.legend b{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px;
  border:1px solid var(--line)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;font-size:12.5px}
.bar u{text-decoration:none;color:var(--mute);font-family:var(--mono)}
.bar div{height:16px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar div>i{display:block;height:100%;background:var(--gold-br);border-radius:3px}
.bar s{text-decoration:none;text-align:right;font-family:var(--mono);color:var(--gold);font-weight:700}
.els{display:grid;gap:5px}
.el{display:grid;grid-template-columns:70px 46px 1fr;gap:9px;font-size:12px;align-items:start;
  padding:7px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}
.el b{font:700 9.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);padding-top:1px}
.el u{text-decoration:none;font-family:var(--mono);color:var(--faint);font-size:11px}
.el span{color:var(--ink);line-height:1.45}
.el.key{border-color:var(--gold-dim);background:var(--gold-soft)}
.ueq{background:var(--black);border-radius:10px;padding:18px 20px;margin:4px 0 14px;color:#fff}
.ueq .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 22px var(--mono);color:#fff}
.ueq .line i{font-style:normal;color:var(--gold-br)}
.ueq .line s{text-decoration:none;color:#7e8794;font-weight:400}
.ueq .terms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.ueq .tm{background:var(--black2);border-radius:8px;padding:10px 12px;border-left:3px solid var(--gold-br)}
.ueq .tm b{display:block;font:800 19px var(--mono);color:var(--gold-br)}
.ueq .tm span{display:block;font-size:11.5px;color:#aab3bf;margin-top:3px;line-height:1.4}
.ueq .sum{margin-top:12px;font:700 15px var(--mono);color:var(--gold-br)}
.ueq .sum s{text-decoration:none;color:#aab3bf;font-weight:400;font-size:12px;margin-left:8px}
.arms{display:grid;gap:10px}
.arm{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--panel2)}
.arm.me{border-color:var(--gold-dim);background:var(--gold-soft)}
.arm .hd{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.arm .hd b{font-size:13px;color:var(--black);flex:0 0 auto;white-space:nowrap}
.arm .hd .ctxs{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap}
.arm .ans{font-family:var(--mono);font-size:12.5px;line-height:1.5;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.arm .ans.bad{border-color:#EDB9B7;background:#FDF5F4}
.arm .ans.good{border-color:#A8D6BE;background:#F3FAF6}
.quote{border-left:3px solid var(--gold-br);padding:4px 0 4px 13px;margin:10px 0;font-size:13px;
  color:var(--ink);line-height:1.6;font-style:italic}
.gsvg{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px}
.gsvg svg{display:block;width:100%;height:auto}
@media(max-width:1180px){
  .stage .body{grid-template-columns:1fr}
  .stage .left{border-right:0;border-bottom:1px solid var(--line)}
  .rail{grid-template-columns:repeat(4,1fr)}
  .kpis,.tiles,.g3,.g4{grid-template-columns:1fr 1fr}
  .hero h1{font-size:30px}
  .ueq .terms{grid-template-columns:1fr}
}
@media(max-width:680px){
  .rail{grid-template-columns:repeat(2,1fr)}
  .kpis,.tiles,.g2,.g3,.g4{grid-template-columns:1fr}
  .wrap{padding:0 16px}
}
</style>
<style>
/* ---------- MAUF ---------- */
.maufwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,370px);gap:18px;align-items:start}
.tri{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.tri svg{display:block;width:100%;max-width:600px;height:auto;margin:0 auto}
.ctrls{display:grid;gap:14px}
.sl{display:grid;gap:6px}
.sl .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.sl .row b{color:var(--gold);font-family:var(--mono)}
.sl input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;background:var(--line);outline:none}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--black);cursor:pointer;border:3px solid var(--gold-br)}
.sl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--black);
  cursor:pointer;border:3px solid var(--gold-br)}
.readout{background:var(--black);border-radius:10px;padding:16px 18px;color:#c3cad4}
.readout .big{font:800 38px/1 var(--sans);color:var(--gold-br);letter-spacing:-.02em}
.readout .big small{font:600 13px var(--sans);color:#8a94a2;margin-left:8px;letter-spacing:0}
.readout .cmp{margin-top:12px;display:grid;gap:5px;font-size:12.5px}
.readout .cmp div{display:flex;justify-content:space-between;gap:10px}
.readout .cmp span:last-child{font-family:var(--mono);color:#fff}
.corpbtns{display:flex;gap:6px;flex-wrap:wrap}
.corpbtns button{flex:1;min-width:130px}
.corpbtns button[aria-pressed=true]{background:var(--black);border-color:var(--black);color:var(--gold-br)}

/* ---------- falsification ---------- */
.fgrid{display:grid;grid-template-columns:minmax(0,310px) minmax(0,1fr);gap:18px;align-items:start}
.flist{display:grid;gap:7px}
.flist button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:11px 13px;cursor:pointer;color:var(--mute);font:inherit;transition:.15s}
.flist button:hover{border-color:var(--gold-dim)}
.flist button[aria-pressed=true]{border-color:var(--black);background:var(--black);color:#c3cad4}
.flist b{display:flex;align-items:center;gap:8px;font:700 10px var(--mono);color:var(--faint);letter-spacing:.1em;margin-bottom:5px}
.flist span{font-size:12.5px;line-height:1.4;display:block}
.ostamp{display:inline-block;padding:2px 7px;border-radius:4px;border:1px solid;flex:0 0 auto}
.ostamp.FALSIFIED,.ostamp.WITHDRAWN{color:var(--bad);border-color:#EDB9B7;background:#FDF0EF}
.ostamp.NARROWED{color:var(--warn);border-color:#E6CFA0;background:#FCF6EA}
.ostamp.HELD{color:var(--good);border-color:#A8D6BE;background:#EDF8F2}
.fstep{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;
  background:var(--panel2);opacity:.3;transition:opacity .35s, border-color .35s, background .35s}
.fstep.on{opacity:1;border-color:var(--gold-dim);background:#fff}
.fstep h5{margin:0 0 6px;font:700 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.fstep p{margin:0;font-size:13.5px;line-height:1.6}
.verdict{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.verdict .stamp{font:800 13px var(--mono);letter-spacing:.14em;padding:7px 14px;border-radius:7px;border:2px solid}
.stamp.FALSIFIED,.stamp.WITHDRAWN{color:var(--bad);border-color:var(--bad);background:#FDF0EF}
.stamp.NARROWED{color:var(--warn);border-color:var(--warn);background:#FCF6EA}
.stamp.HELD{color:var(--good);border-color:var(--good);background:#EDF8F2}
.tally{display:grid;gap:7px}
.tally .row{display:grid;grid-template-columns:1fr 150px 42px;gap:12px;align-items:center;font-size:13px}
.tally .row div{height:18px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tally .row div>i{display:block;height:100%;background:var(--gold-br)}
.tally .row s{text-decoration:none;text-align:right;font-family:var(--mono);color:var(--gold);font-weight:700}

/* ---------- results ---------- */
.ivplot{display:grid;gap:12px}
.iv{display:grid;grid-template-columns:200px minmax(0,1fr) 190px;gap:14px;align-items:center;font-size:13px}
.iv .nm b{display:block;font-size:13.5px;color:var(--black)}
.iv .nm span{color:var(--faint);font-size:11.5px}
.iv .track{position:relative;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.iv .zero{position:absolute;top:0;bottom:0;width:1px;background:var(--faint)}
.iv .band{position:absolute;top:13px;height:8px;border-radius:4px;background:var(--gold-br)}
.iv .band.ns{background:#c3c9d2}
.iv .dot{position:absolute;top:9px;width:15px;height:15px;border-radius:50%;background:var(--black);
  border:3px solid var(--gold-br);margin-left:-7px}

/* ================= PIPELINE ================= */
let CASE = 'q507', STEP = 0, timer = null;

function pageStrip(total, opts) {
  const gold = opts.gold || [], ctx = opts.ctx || [], ranks = opts.ranks || {};
  let h = '<div class="pstrip">';
  for (let p = 1; p <= total; p++) {
    const cls = ['pg'];
    if (ctx.includes(p)) cls.push('ctx');
    if (gold.includes(p)) cls.push('gold');
    if (ranks[p] && !ctx.includes(p) && !gold.includes(p)) cls.push('rank');
    h += `<div class="${cls.join(' ')}">${p}${ranks[p] ? `<i>${ranks[p]}</i>` : ''}</div>`;
  }
  return h + '</div>';
}
const LEGEND = `<div class="legend">
  <span><b style="background:var(--gold-br)"></b>gold evidence page</span>
  <span><b style="background:var(--black)"></b>page sent to the generator</span>
  <span><b style="background:#fff;border-color:var(--blue)"></b>graph-leg rank</span>
  <span><b style="background:#fff"></b>not retrieved</span></div>`;

function bars(obj) {
  const m = Math.max(...Object.values(obj));
  return '<div class="bars">' + Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
    `<div class="bar"><u>${k}</u><div><i style="width:${Math.max(2, 100 * v / m)}%"></i></div><s>${v.toLocaleString()}</s></div>`
  ).join('') + '</div>';
}

const NODE_COL = { section: '#0d1117', text: '#525c6b', figure: '#C8A95C', table: '#2F5FA8', equation: '#A8721B' };
const EDGE_COL = { reading_order: '#b4bcc7', hierarchy: '#2F5FA8', spatial: '#A8721B', caption: '#C8A95C', temporal: '#1C7A4E' };

function subgraphSvg(sg) {
  const N = sg.nodes.length, W = 900, H = 430, cx = W / 2, cy = H / 2 + 4, R = Math.min(132, 44 + N * 7);
  const pt = i => { const a = -Math.PI / 2 + 2 * Math.PI * i / N; return { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a }; };
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Subgraph of the gold evidence page">`;
  sg.edges.forEach(([i, j, t]) => {
    const a = pt(i), b = pt(j), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const qx = cx + (mx - cx) * 0.45, qy = cy + (my - cy) * 0.45;
    s += `<path d="M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${qx.toFixed(1)},${qy.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}"
      fill="none" stroke="${EDGE_COL[t] || '#ccc'}" stroke-width="${t === 'reading_order' ? 1.3 : 1.9}" opacity=".85"/>`;
  });
  sg.nodes.forEach((n, i) => {
    const p = pt(i), out = Math.cos(p.a) >= 0;
    const lx = cx + (R + 16) * Math.cos(p.a), ly = cy + (R + 16) * Math.sin(p.a);
    s += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9" fill="${NODE_COL[n.t] || '#888'}" stroke="#fff" stroke-width="2"/>`;
    s += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" font-size="11" fill="#525c6b"
      text-anchor="${out ? 'start' : 'end'}">${esc(n.l.length > 26 ? n.l.slice(0, 26) + '…' : n.l)}</text>`;
  });
  s += `<text x="${cx}" y="${cy - 6}" font-size="12" fill="#8a94a2" text-anchor="middle">gold page ${sg.page || ''}</text>
        <text x="${cx}" y="${cy + 13}" font-size="15" font-weight="700" fill="#0d1117" text-anchor="middle">${N} nodes | ${sg.edges.length} edges</text></svg>`;
  const used = [...new Set(sg.edges.map(e => e[2]))];
  return `<div class="gsvg">${s}</div>
    <div class="legend" style="margin-top:9px">
      ${used.map(t => `<span><b style="background:${EDGE_COL[t]}"></b>${t}</span>`).join('')}
      ${Object.entries(NODE_COL).filter(([k]) => sg.nodes.some(n => n.t === k)).map(([k, c]) => `<span><b style="background:${c};border-radius:50%"></b>${k} node</span>`).join('')}
    </div>`;
}

function armBlock(c, key, label, extra) {
  const a = c.arms[key], me = key === 'gramm';
  const ok = a.anls >= 0.5;
  return `<div class="arm ${me ? 'me' : ''}">
    <div class="hd"><b>${label}</b>
      ${me ? '<span class="pill g">system under study</span>' : ''}
      <span class="pill ${a.hit ? 'ok' : 'no'}">${a.hit ? 'gold page in context' : 'gold page missed'}</span>
      <span class="ctxs">pages ${a.context.join(' | ')}</span></div>
    ${extra === 'answer' ? `<div class="ans ${ok ? 'good' : 'bad'}">${esc(a.pred.length > 320 ? a.pred.slice(0, 320) + '…' : a.pred)}</div>` : ''}
    ${extra === 'score' ? `<div class="ans ${ok ? 'good' : 'bad'}">ANLS <b style="color:${ok ? 'var(--good)' : 'var(--bad)'}">${f4(a.anls)}</b> &nbsp;|&nbsp; ${esc(a.pred.length > 150 ? a.pred.slice(0, 150) + '…' : a.pred)}</div>` : ''}
    ${extra === 'ctx' ? pageStrip(c.doc.pages, { gold: c.question.gold_pages, ctx: a.context }) : ''}
  </div>`;
}

function stages(c) {
  const q = c.question, d = c.doc, ranks = {};

  const goldRank = ranks[c.parse.gold_page];

  const term = (sym, val, wt, label) => `<div class="tm"><b>${sym} = ${f4(val)}</b><span>${label}<br>weight ${wt.toFixed(2)} &rarr; ${f4(wt * val)}</span></div>`;

  return [
    { t: 'Raw corpus', s: 'The document, before anything is done to it',
      src: '§3.3 | Table 3',
      act: `A single PDF enters the pipeline. No OCR shortcuts, no pre-chunked text: ${d.pages} pages, parsed from the file itself. Every arm in the comparison reads this same file through this same parse, which is what makes a later difference attributable to retrieval.`,
      meas: [['Document', d.hash.slice(0, 12) + '…'], ['Pages', d.pages], ['Corpus', 'MMLongBench-Doc'], ['Questions in corpus', '1,091'], ['Unanswerable', '244 (22.4%)']],
      art: `<h4>Artifact | the page surface</h4>${pageStrip(d.pages, { gold: q.gold_pages })}
        <p class="note" style="margin:0 0 10px"><b style="color:var(--gold)">${d.title}</b><br>${d.blurb}</p>
        <p style="margin:0 0 12px"><button class="act pri" onclick="openPdf('${d.hash}','${d.title.replace(/'/g, '')}','${d.pages} pages | page ${q.gold_pages.join(', ')} holds the answer')">&#128196; Open the source PDF</button></p>
        <div class="quote">${esc(q.text)}</div>
        <p class="note">Gold answer <b class="mono" style="color:var(--gold)">${esc(q.gold)}</b> |
        evidence on page <b class="mono" style="color:var(--gold)">${q.gold_pages.join(', ')}</b> |
        annotated source ${q.evidence_sources.length ? q.evidence_sources.join(', ') : 'not annotated'} |
        answer format ${q.answer_format}</p>`,
      guide: `<b>Start here.</b> The whole demonstration is one question against one document. Open the PDF and look at page ${q.gold_pages.join(', ')}. It is the only page that holds the answer, and three retrieval arms will disagree about whether to send it to the generator.` },

    { t: 'Parse', s: 'MinerU five-model chain into typed elements',
      src: '§3.4 | Figure 2',
      act: `Layout detection, OCR, formula and table extraction produce typed elements with bounding boxes and reading-order indices. Five node types survive into the graph: text, table, figure, equation, section. The temporal annotator runs here too, writing period markers onto elements.`,
      meas: [['Elements parsed', d.elements], ['Text', d.by_type.text || 0], ['Section', d.by_type.section || 0], ['Figure', d.by_type.figure || 0], ['Table', d.by_type.table || 0], ['Carrying a period marker', d.temporal_elems]],
      art: `<h4>Artifact | <span class="mono">parsed_elements.json</span>, page ${c.parse.gold_page}</h4>
        <div class="scroller"><div class="els">${c.parse.elements_on_gold_page.map(e => {
          const key = e.text && (c.evidence_text.slice(0, 24).includes(e.text.slice(0, 18)) || e.text.includes(q.gold));
          return `<div class="el ${key ? 'key' : ''}"><b>${e.type}</b><u>ro ${e.ro}</u><span>${e.text ? esc(e.text) : '<i style="color:var(--faint)">[no text layer, image element]</i>'}</span></div>`;
        }).join('')}</div></div>
        <p class="note" style="margin-top:10px">${c.evidence_note}</p>`,
      guide: `<b>${d.elements} elements, not ${d.pages} pages.</b> The parse is what the graph is built over, and the unit is an element. Everything downstream, from the typed relations to the page the generator finally sees, is derived from this list.` },

    { t: 'Graph', s: 'Heterogeneous graph over the parsed elements',
      src: '§3.5 | Table 4',
      act: `Eight typed relations are defined; seven are deterministic. Reading order and hierarchy are dense and universal. Spatial proximity and caption linking, the two relations most specific to visual layout, turn out to be the two that barely materialise, which is a finding rather than a defect.`,
      meas: [['Nodes', c.graph.nodes], ['Edges rebuilt', c.graph.total], ...Object.entries(c.graph.edges).map(([k, v]) => [k, v])],
      art: `<h4>Artifact | the subgraph induced on the gold page</h4>
        <div class="scroller">${subgraphSvg(c.subgraph)}
        <h4 style="margin-top:14px">Typed relations across the whole document</h4>${bars(c.graph.edges)}
        <p class="note" style="margin-top:12px">Rebuilt from the shipped parse using the same deterministic rules the system builds edges with. The node-level subgraph itself was never saved during the run. Co-reference, cross-page and the model-extracted triplet relation are not reconstructed here.</p>
        ${c.graph.examples.temporal ? `<p class="note">Example temporal edge: <span class="mono">${c.graph.examples.temporal[0][0]} &harr; ${c.graph.examples.temporal[0][1]}</span>, both resolving to <mark>${c.graph.examples.temporal[0][2]}</mark></p>` : '<p class="note">No temporal edges on this document: nothing in it carries a resolvable period marker.</p>'}</div>`,
      guide: `<b>Density is not usefulness.</b> ${c.graph.edges.temporal ? `This document produces ${c.graph.edges.temporal} temporal edges and the period mask runs on every query, yet no corpus here labels which questions depend on a period, so the mechanism is active and unmeasured.` : 'This document produces no temporal edges at all, which is why the temporal attribute sits at its neutral value when the utility function is scored at the next stage.'}` },

    { t: 'Retrieve', s: 'HGT message passing, router, cross-encoder rerank',
      src: '§3.6 | Figure 4',
      act: `A two-layer Heterogeneous Graph Transformer passes messages with per-relation attention. A DeBERTa-v3 router was trained to choose between vector, graph and hybrid paths, then bypassed: ROUTE_ALL_HYBRID sends every question down the hybrid path, so the recorded route is an analysis annotation rather than a control signal.`,
      meas: [['Recorded route', c.retrieve.route], ['Graph-leg top pages', c.retrieve.ranked.slice(0, 6).join(', ')], ['Gold page rank', goldRank ? '#' + goldRank : 'not in the top 10'], ['Rerank pool', '20'], ['HGT layers', '2']],
      art: `<h4>Artifact | the graph leg's page ranking</h4>${pageStrip(d.pages, { gold: q.gold_pages, ranks })}${LEGEND}
        <p class="note">Ranked pages, in order: <span class="mono" style="color:var(--gold)">${c.retrieve.ranked.join(' → ')}</span></p>
        <p class="note">${goldRank === 1
          ? `The graph ranks page <mark>${c.parse.gold_page}</mark> <b>first</b>. This is the measurement APPA scores.`

    { t: 'Score', s: 'Multi-attribute Utility Function',
      src: '§3.7 | Table 30',

      meas: [['Budget', '3 pages | 12,000 chars'], ['GraMM-RAG context', c.arms.gramm.context.join(', ')], ['Page-matched control', c.arms.k3.context.join(', ')], ['Unmatched control', c.arms.k2.context.join(', ')], ['Gold page delivered', [c.arms.gramm, c.arms.k3, c.arms.k2].filter(a => a.hit).length + ' of 3 arms']],
      art: `<h4>Artifact | what each arm actually sends to the generator</h4>
        <div class="arms">
          ${armBlock(c, 'gramm', 'GraMM-RAG', 'ctx')}

      art: `<h4>Artifact | three answers to one question</h4>

    { t: 'Evaluate', s: 'Score, test, and decide what may be claimed',

      meas: [['GraMM-RAG ANLS', f4(c.arms.gramm.anls)], ['Page-matched control', f4(c.arms.k3.anls)], ['Unmatched control', f4(c.arms.k2.anls)], ['Corpus delta vs matched', '+0.0293'], ['95% interval', '[+0.0083, +0.0506]']],
      art: `<h4>Artifact | the per-question verdict</h4>

        : `<b>Same budget, one page apart.</b> Both controls had pages 3 and 11. The page-matched arm spent its third page on navigation and answered with the state; GraMM-RAG spent its third page on the lookup table the graph ranked first. This is the comparison the whole evaluation is built to make.` }
  ];
}

function renderPipeline() {
  const c = DATA.cases[CASE], S = stages(c), s = S[STEP];
  const rail = $('#rail'); rail.innerHTML = '';
  S.forEach((st, i) => {
    const b = E('button', i < STEP ? 'done' : '', `<em>${String(i + 1).padStart(2, '0')}</em><i>${st.t}</i>`);
    b.setAttribute('aria-current', i === STEP);
    b.onclick = () => { stop(); STEP = i; renderPipeline(); };
    rail.appendChild(b);
  });
  $('#qhead').innerHTML = `
    <div class="doc"><span class="pill g">${esc(c.doc.type)}</span>
      <span class="pill">${c.doc.pages} pages</span>
      <span class="pill">${c.doc.elements} parsed elements</span>
      <span class="src">question ${c.qidx} of 1,091 | MMLongBench-Doc | archived run, seed 42</span></div>
    <div class="q">${esc(c.question.text)}</div>
    <div class="gold">Gold answer <b>${esc(c.question.gold)}</b> | evidence page ${c.question.gold_pages.join(', ')}</div>`;
  $('#stageBody').innerHTML = `
    <div class="top"><div class="no">${STEP + 1}</div>
      <div class="ttl"><h2>${s.t}</h2><p>${s.s}</p></div>
      <div class="src">${s.src}</div></div>
    <div class="body">
      <div class="left"><h4>What happens</h4><p>${s.act}</p>
        <h4>Measured</h4><div class="meas">${s.meas.map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join('')}</div></div>
      <div class="right">${s.art}</div>
    </div>`;
  $('#guide').innerHTML = s.guide;
  $('#prev').disabled = STEP === 0;
  $('#next').disabled = STEP === S.length - 1;
  document.querySelectorAll('.casebtn').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === CASE));
}
function stop() { if (timer) { clearInterval(timer); timer = null; $('#play').innerHTML = '&#9654; Play all'; } }
function play() {
  if (timer) return stop();
  $('#play').innerHTML = '&#10073;&#10073; Pause';
  timer = setInterval(() => {
    if (STEP >= 7) { stop(); return; }
    STEP++; renderPipeline();
  }, +$('#spd').value);
}

let CORP = 'mmlongbench', W = [0.40, 0.40, 0.20], search = null, baseCorp = null;

const TRI = { w: 560, h: 500, pad: 54 };
function bary(a, b, c) {
  const s = a + b + c || 1; a /= s; b /= s; c /= s;
  const W2 = TRI.w - 2 * TRI.pad, H2 = TRI.h - 2 * TRI.pad - 26;
  return { x: TRI.pad + W2 * (b + c / 2), y: TRI.pad + H2 * (1 - c) };
}
function heat(t) { // light grey -> deep gold
  const lo = [238, 240, 243], hi = [143, 111, 30];
  return `rgb(${lo.map((v, i) => Math.round(v + (hi[i] - v) * t)).join(',')})`;
}
function nearestGrid(d, a, b, c) {
  let best = null, bd = 1e9;
  for (const p of d.grid) { const t = (p.a - a) ** 2 + (p.b - b) ** 2 + (p.c - c) ** 2; if (t < bd) { bd = t; best = p; } }
  return best;
}
function drawBase() {
  const d = DATA.mauf[CORP], el = $('#tri'); if (!el) return;
  const lo = Math.min(...d.grid.map(p => p.auc)), hi = Math.max(...d.grid.map(p => p.auc));
  const P = bary(1, 0, 0), Q = bary(0, 1, 0), R = bary(0, 0, 1);
  let s = `<svg viewBox="0 0 ${TRI.w} ${TRI.h}" role="img" aria-label="Weight simplex coloured by AUC">
    <polygon points="${P.x},${P.y} ${Q.x},${Q.y} ${R.x},${R.y}" fill="#fcfcfd" stroke="#dde2e8"/>`;
  for (const p of d.grid) {
    const { x, y } = bary(p.a, p.b, p.c), t = (p.auc - lo) / (hi - lo || 1);
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${p.c === 0 ? 7.5 : 6.5}" fill="${heat(t)}"
      stroke="${p.c === 0 ? '#8F6F1E' : 'none'}" stroke-width="${p.c === 0 ? 1.2 : 0}"/>`;
  }
  const bp = bary(d.best.a, d.best.b, d.best.c), sp = bary(...d.shipped);
  s += `<circle id="mBest" cx="${bp.x}" cy="${bp.y}" r="11" fill="none" stroke="#1C7A4E" stroke-width="2.5"/>
        <circle id="mShip" cx="${sp.x}" cy="${sp.y}" r="9" fill="none" stroke="#2F5FA8" stroke-width="2.5"/>
        <circle id="mCur" cx="${sp.x}" cy="${sp.y}" r="14" fill="none" stroke="#B3332F" stroke-width="3"
          style="transition:cx .09s linear, cy .09s linear"/>
        <text x="${P.x - 4}" y="${P.y + 24}" fill="#525c6b" font-size="13" text-anchor="middle">a = 1 | coverage</text>
        <text x="${Q.x + 4}" y="${Q.y + 24}" fill="#525c6b" font-size="13" text-anchor="middle">b = 1 | similarity</text>
        <text x="${R.x}" y="${R.y - 16}" fill="#525c6b" font-size="13" text-anchor="middle">c = 1 | temporal</text>
        <text x="${(P.x + Q.x) / 2}" y="${P.y + 46}" fill="#8F6F1E" font-size="12" text-anchor="middle" font-weight="600">the c = 0 edge, where every optimum sits</text>
      </svg>`;
  el.innerHTML = s;
  baseCorp = CORP;
}
function drawTri() {
  if (baseCorp !== CORP) drawBase();
  const d = DATA.mauf[CORP], cur = nearestGrid(d, W[0], W[1], W[2]);
  const cp = bary(cur.a, cur.b, cur.c), m = $('#mCur');
  if (m) { m.setAttribute('cx', cp.x.toFixed(1)); m.setAttribute('cy', cp.y.toFixed(1)); }
  $('#auc').innerHTML = `${f4(cur.auc)}<small>AUC | ${CORP === 'mmlongbench' ? 'MMLongBench-Doc' : 'DocBench'}</small>`;
  $('#wlab').innerHTML = `a = ${cur.a.toFixed(2)} | b = ${cur.b.toFixed(2)} | c = ${cur.c.toFixed(2)}`;
  $('#cmp').innerHTML = `
    <div><span>Shipped weights ${d.shipped.join(' / ')}</span><span>${f4(d.shipped_auc)}</span></div>
    <div><span>Best found on the grid</span><span>${f4(d.best.auc)} at ${d.best.a} / ${d.best.b} / ${d.best.c}</span></div>
    <div><span>Coverage C alone</span><span>${f4(d.marginal.C)}</span></div>
    <div><span>Similarity S alone</span><span>${f4(d.marginal.S)}</span></div>
    <div><span>Temporal T alone</span><span>${f4(d.marginal.T)}</span></div>
    <div><span>Generator on identical pages</span><span>${CORP === 'mmlongbench' ? '0.8060' : '0.7500'}</span></div>`;
  $('#verdict').innerHTML = cur.c === 0
    ? 'Temporal term switched off. This edge contains the optimum on <b>both</b> corpora.'
    : (cur.auc < d.best.auc - 0.0005
      ? `Giving the temporal term weight costs <b>${f4(d.best.auc - cur.auc)}</b> AUC against the best point on the c = 0 edge.`
      : 'At this weighting the temporal term is effectively inert.');
}
function runSearch() {
  if (search) { clearInterval(search); search = null; $('#go').innerHTML = '&#8634; Grid search'; return; }
  const d = DATA.mauf[CORP]; let i = 0, bestA = -1, bestP = null;
  $('#go').innerHTML = '&#10073;&#10073; Stop';
  search = setInterval(() => {
    if (i >= d.grid.length) {
      clearInterval(search); search = null; $('#go').innerHTML = '&#8634; Grid search';
      W = [bestP.a, bestP.b, bestP.c]; syncSliders(); labelSliders(); drawTri();
      $('#prog').innerHTML = `search complete | ${d.grid.length} weightings evaluated | best ${f4(bestA)} at c = ${bestP.c.toFixed(2)}`;
      return;
    }
    const p = d.grid[i++];
    if (p.auc > bestA) { bestA = p.auc; bestP = p; }
    W = [p.a, p.b, p.c]; syncSliders(); labelSliders(); drawTri();
    $('#prog').innerHTML = `evaluating ${i} of ${d.grid.length} | best so far ${f4(bestA)} at c = ${bestP.c.toFixed(2)}`;
  }, 55);
}
function syncSliders() { ['a', 'b', 'c'].forEach((k, i) => { const s = $('#s' + k); if (s) s.value = Math.round(W[i] * 100); }); }
function labelSliders() { ['a', 'b', 'c'].forEach((k, i) => { const l = $('#l' + k); if (l) l.textContent = W[i].toFixed(2); }); }

      <p class="note"><b style="color:var(--gold)">A second, independent witness.</b> Per question, U correlates
      +0.17 with whether the gold page reached context and &minus;0.05 with answer quality. On DocBench, +0.29 against
      +0.06. The score measures retrieval success, not answerability.</p></div>`;
  return v;
}

/* ================= INIT ================= */
(function init() {
  buildNav();
  const m = $('#main');
  m.appendChild(viewOverview());
  m.appendChild(viewPipeline());
  m.appendChild(viewMauf());
  m.appendChild(viewFalsify());
  m.appendChild(viewResults());
  wirePipeline(); wireMauf(); wireFalsify();
  go('overview');
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePdf();
    if (current !== 'pipeline') return;
    if (e.key === 'ArrowRight') { stop(); if (STEP < 7) { STEP++; renderPipeline(); } }
    if (e.key === 'ArrowLeft') { stop(); if (STEP > 0) { STEP--; renderPipeline(); } }
  });
  $('#pdfModal').addEventListener('click', e => { if (e.target.id === 'pdfModal') closePdf(); });
})();

</script>
</body></html>
